[project]
name = "ergp-agent"
version = "0.1.0"
description = "Email-to-ERP agentic workflow"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "langgraph>=1.2.9",
    "mlflow>=3.14.0",
    "openai>=2.48.0",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
